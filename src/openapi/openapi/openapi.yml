openapi: 3.0.3
info:
  title: My Project API
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: https://api.platform.internal:8445
    description: Local Development Server
tags:
  - name: auth
    description: Cookie-based authentication
  - name: users
    description: User management
paths:
  /login:
    $ref: "./paths/auth.yml#/~1login"
  /refresh:
    $ref: "./paths/auth.yml#/~1refresh"
  /logout:
    $ref: "./paths/auth.yml#/~1logout"
  /me:
    $ref: "./paths/auth.yml#/~1me"
  /users:
    $ref: "./paths/users.yml"
components:
  schemas:
    User:
      $ref: "./components/schemas/user.yml#/User"
    CreateUser:
      $ref: "./components/schemas/user.yml#/CreateUser"
