get:
  summary: Get users
  operationId: get-users
  tags:
    - users
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/user.yml#/User'
post:
  summary: Create a user
  operationId: create-user
  tags:
    - users
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/user.yml#/NewUser'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user.yml#/User'
