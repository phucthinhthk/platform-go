openapi: 3.0.3
info:
  title: My Project API
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- description: Local Development Server
  url: https://api.platform.internal:8445
tags:
- description: Cookie-based authentication
  name: auth
- description: User management
  name: users
paths:
  /login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginUser"
          description: "Authenticated; JWT, refresh and CSRF cookies are set."
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials
      summary: Sign in as an administrator
      tags:
      - auth
  /refresh:
    post:
      operationId: refresh
      responses:
        "204":
          description: Cookies refreshed
        "401":
          description: Invalid refresh token
      summary: Refresh authentication cookies
      tags:
      - auth
  /logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out
      summary: Clear authentication cookies
      tags:
      - auth
  /me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginUser"
          description: Current user
        "401":
          description: Unauthenticated
      summary: Get the currently authenticated administrator
      tags:
      - auth
  /users:
    get:
      operationId: get-users
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
          description: OK
      summary: Get users
      tags:
      - users
    post:
      operationId: create-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Created
      summary: Create a user
      tags:
      - users
components:
  schemas:
    User:
      example:
        id: 0
        name: name
        createdAt: 2000-01-23T04:56:07.000+00:00
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    CreateUser:
      example:
        name: name
      properties:
        name:
          type: string
      required:
      - name
      type: object
    LoginRequest:
      example:
        email: email
        password: password
      properties:
        email:
          format: email
          type: string
        password:
          format: password
          type: string
      required:
      - email
      - password
      type: object
    LoginUser:
      example:
        id: 0
        name: name
        email: email
        accountType: admin
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
        email:
          format: email
          type: string
        accountType:
          example: admin
          type: string
      required:
      - accountType
      - email
      - id
      - name
      type: object
